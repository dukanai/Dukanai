<script>
  // Awaaz bolne wala function
  function speakWelcome() {
    if (!('speechSynthesis' in window)) { return; }
    var synth = window.speechSynthesis;
    var msg = new SpeechSynthesisUtterance('Hello! Welcome to Dukaan A I!');

    // Phone ki English voice dhundo (pehle Indian English, nahi mili to koi bhi English)
    var voices = synth.getVoices();
    var voice = null;
    for (var i = 0; i < voices.length; i++) {
      if (voices[i].lang === 'en-IN' || voices[i].lang === 'en_IN') { voice = voices[i]; break; }
    }
    if (!voice) {
      for (var j = 0; j < voices.length; j++) {
        if (voices[j].lang && voices[j].lang.toLowerCase().indexOf('en') === 0) { voice = voices[j]; break; }
      }
    }
    if (voice) {
      msg.voice = voice;
      msg.lang = voice.lang;
    } else {
      msg.lang = 'en-US';
    }

    msg.rate = 0.95;
    msg.volume = 1;
    synth.resume();
    synth.speak(msg);
  }
  Get Started dabane par: awaaz bhi aur agla screen bhi
  function startApp() {
    speakWelcome();
    document.getElementById('splash').style.display = 'none';
    document.getElementById('roles').style.display = 'block';
  }
</script>
