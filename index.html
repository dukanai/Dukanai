<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DukaanAI</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f8ff;
      text-align: center;
      padding: 40px 20px;
    }
    h1 {
      color: #1a73e8;
      font-size: 32px;
    }
    p {
      font-size: 18px;
      color: #333;
    }
    button {
      background-color: #1a73e8;
      color: white;
      font-size: 18px;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      margin-top: 20px;
    }
    #message {
      color: #0b8043;
      font-size: 18px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>Welcome to DukaanAI</h1>
  <p>Aapke shehar ki har dukaan, ab ek jagah.</p>
  <button onclick="showMessage()">Dukaan dhundo</button>
  <p id="message"></p>

  <script>
    function showMessage() {
      document.getElementById("message").innerText =
        "Jehanabad ki dukaanein jaldi aa rahi hain!";
    }
  </script>
</body>
</html>
