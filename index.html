<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DukaanAI</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f8ff;
      text-align: center;
      padding: 40px 20px;
    }
    h1 {
      color: #1a73e8;
      font-size: 32px;
    }
    p {
      font-size: 18px;
      color: #333;
    }
    button {
      background-color: #1a73e8;
      color: white;
      font-size: 18px;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      margin-top: 20px;
    }
    #message {
      color: #0b8043;
      font-size: 18px;
      margin-top: 20px;
    }
    #list {
      max-width: 400px;
      margin: 20px auto 0 auto;
    }
    .item {
      background-color: white;
      border: 1px solid #d0dcf5;
      border-radius: 8px;
      padding: 12px 16px;
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      color: #333;
    }
    .price {
      color: #1a73e8;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Welcome to DukaanAI</h1>
  <p>Aapke shehar ki har dukaan, ab ek jagah.</p>
  <button onclick="showItems()">Dukaan dhundo</button>
  <p id="message"></p>
  <div id="list"></div>

  <script>
    var items = [
      { name: "Atta (5 kg)", price: 220 },
      { name: "Chawal (1 kg)", price: 60 },
      { name: "Arhar Dal (1 kg)", price: 140 },
      { name: "Sarson Tel (1 L)", price: 150 },
      { name: "Chini (1 kg)", price: 45 },
      { name: "Namak (1 kg)", price: 25 }
    ];

    function showItems() {
      document.getElementById("message").innerText =
        "Jehanabad ki kirana dukaan ka samaan (namuna):";

      var html = "";
      for (var i = 0; i < items.length; i++) {
        html += '<div class="item"><span>' + items[i].name +
          '</span><span class="price">₹' + items[i].price + '</span></div>';
      }
      document.getElementById("list").innerHTML = html;
    }
  </script>
</body>
</html>
